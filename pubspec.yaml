name: books_online
description: "A Flutter app scaffolded by flutter_blueprint with BLoC."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  auto_route: ^9.2.2
  equatable: ^2.0.5
  flutter_dotenv: ^6.0.1
  dio: ^5.5.0
  connectivity_plus: ^6.1.5   # or whatever the current latest is
  pretty_dio_logger: ^1.4.0
  injectable: ^2.4.4
  injectable_generator: ^2.6.2
  carousel_slider: ^5.1.2
  salomon_bottom_bar: ^3.3.2
  get_it: ^8.3.0
  cached_network_image: ^3.4.1
  just_audio: ^0.10.6
  rxdart: ^0.28.0
  in_app_purchase: ^3.2.3
  url_launcher: ^6.3.2
  collection: ^1.19.1
  modal_bottom_sheet: ^3.0.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  flutter_form_builder: ^10.0.1
  awesome_dialog: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  auto_route_generator: ^9.3.1
  mocktail: ^1.0.3
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/audio/
    - assets/subtitles/
