version: 1
app_name: "books_online"
platforms:
  - "mobile"
state_management: "bloc"
ci_provider: "none"
analytics_provider: "none"
features:
  accessibility: false
  analytics: false
  api: true
  env: true
  hive: false
  localization: false
  maps: false
  media: false
  pagination: false
  push_notifications: false
  social_auth: false
  tests: true
  theme: true
  theme_mode: false
  websocket: false
api_config:
  success_key: "success"
  success_value: true
  data_key: "data"
  nested_data_path: null
  error_message_path: "message"
  error_code_path: "error_code"
  token_source: "body"
  access_token_path: "data.accessToken"
  refresh_token_path: "data.refreshToken"
  auth_header_name: "Authorization"
  auth_header_prefix: "Bearer "
graphql_client: "none"
ai_governance:
  enabled: true
  level: "full"
  ci_mode: "advisory-only"
  owner: "@your-github-handle"
